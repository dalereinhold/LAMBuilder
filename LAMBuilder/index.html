<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LAM Builder</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="sidebar">
    <h2>LAM Builder</h2>
    <button id="addPanelDataBtn">Add Panel Data</button>
    <button id="addOptionBtn">Add New Option</button>
    <ul id="optionsList"></ul>
  </div>

  <div id="editor">
    <h2>Settings Panel</h2>
    <div id="panelDataEditor"></div>
    <div id="propertyEditor">Select an option to edit.</div>
  </div>

<div id="preview">
  <h2 id="previewTitle">Lua Preview</h2>
  <div id="previewOutput" class="preview-box"></div>
  <div class="preview-controls">
    <button id="togglePreviewBtn">Switch to Live Preview</button>
    <button id="copyBtn">Copy Lua</button>
  </div>
</div>

  <script src="src/main.js"></script>
</body>
</html>
